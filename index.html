<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De mamá ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo degradado animado */
            background: linear-gradient(120deg, #fccb90 0%, #d57eeb 100%);
            background-size: 200% 200%;
            animation: gradientBG 6s ease infinite;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenedor flotante (Efecto cristal) */
        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            width: 400px;
            position: relative;
            z-index: 10;
            animation: float 3s ease-in-out infinite;
            border: 4px solid white;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* ESTILO NUEVO PARA EL OSITO Y LA CARTA (EMOJIS) */
        .emoji-header {
            font-size: 6rem; /* Tamaño grande */
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); /* Sombra suave */
            animation: bounce 2s infinite; /* Pequeño rebote tierno */
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #e91e63;
            font-size: 2.2rem;
            margin: 10px 0 30px 0;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            animation: pulse 1.5s infinite; /* El botón Sí late */
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #noBtn {
            background-color: #f0f0f0;
            color: #555;
        }

        /* Pantalla final */
        #success-screen {
            display: none;
            text-align: center;
            z-index: 20;
            width: 100%;
        }

        .success-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-top: 20px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .final-gif {
            width: 280px;
            border-radius: 20px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Lluvia de fondo */
        .heart-bg {
            position: absolute;
            top: -10%;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="card" id="question-card">
        <div class="emoji-header">🧸 💌</div>
        
        <h1>Con cariño de mamá, ¿quieres ser mi Valentine's?</h1>
        
        <div class="buttons">
            <button id="noBtn">No</button>
            <button id="yesBtn">Sí</button>
        </div>
    </div>

    <div id="success-screen">
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAj/bear-kiss-bear-kisses.gif" alt="Love Bear" class="final-gif">
        <div class="success-text">I love You. 🌹❤️</div>
    </div>

    <script>
        // Lógica de los botones
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionCard = document.getElementById('question-card');
        const successScreen = document.getElementById('success-screen');

        let scale = 1;
        let padding = 12;

        noBtn.addEventListener('click', () => {
            // El botón NO se mueve aleatoriamente para dificultar el click
            const randomX = Math.random() * 80 - 40;
            const randomY = Math.random() * 80 - 40;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            // El botón SÍ crece
            scale += 0.3;
            padding += 5;
            yesBtn.style.transform = `scale(${scale})`;
            yesBtn.style.padding = `${padding}px ${padding * 2}px`;

            // Cambiar texto del botón No
            const texts = ["¿Segura?", "¡Por favor!", "¡Mamá te ama!", "¡Di que sí!", "🥺"];
            noBtn.innerText = texts[Math.floor(Math.random() * texts.length)];
        });

        yesBtn.addEventListener('click', () => {
            questionCard.style.display = 'none';
            successScreen.style.display = 'block';
            
            // Lanzar confeti extra
            createConfetti();
        });

        // Crear lluvia de corazones de fondo al cargar
        function createBackgroundHearts() {
            const symbols = ['❤️', '💖', '🌸', '✨', '🧸'];
            const colors = ['#ff4d4d', '#ff9a9e', '#fad0c4', '#ffffff'];

            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-bg');
                heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 3 + 4 + 's'; // Entre 4 y 7 segundos
                heart.style.fontSize = Math.random() * 20 + 15 + 'px';
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(heart);
                
                setTimeout(() => { heart.remove(); }, 7000);
            }, 300);
        }

        // Efecto especial al ganar
        function createConfetti() {
            setInterval(() => {
                const conf = document.createElement('div');
                conf.classList.add('heart-bg');
                conf.innerText = '🌹';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10vh';
                conf.style.animationDuration = Math.random() * 2 + 2 + 's'; // Más rápido
                conf.style.fontSize = Math.random() * 30 + 20 + 'px';
                document.body.appendChild(conf);
                setTimeout(() => { conf.remove(); }, 4000);
            }, 100);
        }

        createBackgroundHearts();
    </script>
</body>
</html>
